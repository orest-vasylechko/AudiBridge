name: Build unsigned AudiBridge IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project AudiBridge.xcodeproj \
            -target AudiBridge \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="$PWD/build/Release-iphoneos/AudiBridge.app"
          test -d "$APP"
          rm -rf Payload AudiBridge-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry AudiBridge-unsigned.ipa Payload
          /usr/bin/unzip -t AudiBridge-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AudiBridge-unsigned-ipa
          path: AudiBridge-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
